# Ne versionnez jamais le fichier réel secret.yaml.
# Copiez ce fichier, remplacez toutes les valeurs, puis appliquez-le avec kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: erpstock-secrets
  namespace: erpstock
type: Opaque
stringData:
  postgres-password: REPLACE_WITH_A_STRONG_POSTGRES_PASSWORD
  connection-string: Host=postgres;Port=5432;Database=GestionStock;Username=postgres;Password=REPLACE_WITH_A_STRONG_POSTGRES_PASSWORD
  gemini-api-key: REPLACE_WITH_YOUR_GEMINI_API_KEY
  jwt-key: REPLACE_WITH_A_RANDOM_JWT_KEY_AT_LEAST_32_CHARACTERS_LONG
  initial-admin-password: REPLACE_WITH_A_STRONG_ADMIN_PASSWORD
  initial-consultant-password: REPLACE_WITH_A_STRONG_CONSULTANT_PASSWORD
