apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erpstock
  labels:
    app.kubernetes.io/part-of: erpstock
spec:
  ingressClassName: nginx
  rules:
    - host: erpstock.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
