apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: erpstock
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: erpstock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: erpstock
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: gestionstock-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: erpstock-secrets
                  key: connection-string
            - name: Gemini__ApiKey
              valueFrom:
                secretKeyRef:
                  name: erpstock-secrets
                  key: gemini-api-key
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: erpstock-secrets
                  key: jwt-key
            - name: InitialUsers__SuperAdmin__Password
              valueFrom:
                secretKeyRef:
                  name: erpstock-secrets
                  key: initial-admin-password
            - name: InitialUsers__Consultant__Password
              valueFrom:
                secretKeyRef:
                  name: erpstock-secrets
                  key: initial-consultant-password
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
