name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  quality-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restaurer les dépendances backend
        run: dotnet restore ERPStock.sln

      - name: Tester le backend
        run: dotnet test ERPStock.sln --configuration Release --no-restore

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ERPStock.Frontend/package-lock.json

      - name: Vérifier et construire le frontend
        working-directory: ERPStock.Frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Construire l'image API
        run: docker build --tag erpstock-api:ci --file ERPStock.API/Dockerfile .

      - name: Construire l'image frontend
        run: docker build --tag erpstock-frontend:ci ERPStock.Frontend

      - name: Analyser les vulnérabilités de l'image API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: erpstock-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish-images:
    needs: quality-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Authentifier GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ERPStock.API/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erpstock-api:${{ github.ref_name }}

      - name: Publier l'image frontend
        uses: docker/build-push-action@v6
        with:
          context: ERPStock.Frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erpstock-frontend:${{ github.ref_name }}
