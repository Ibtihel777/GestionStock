services:
  postgres:
    image: postgres:16
    container_name: erpstock-postgres
    environment:
      POSTGRES_DB: GestionStock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ERPStock.API/Dockerfile
    container_name: erpstock-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=GestionStock;Username=postgres;Password=${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}"
      Gemini__ApiKey: ${GEMINI_API_KEY:?GEMINI_API_KEY doit être défini dans .env}
      Jwt__Key: ${JWT_KEY:?JWT_KEY doit être défini dans .env}
      InitialUsers__SuperAdmin__Password: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD doit être défini dans .env}
      InitialUsers__Consultant__Password: ${INITIAL_CONSULTANT_PASSWORD:?INITIAL_CONSULTANT_PASSWORD doit être défini dans .env}
    ports:
      - "5083:8080"

  frontend:
    build:
      context: ./ERPStock.Frontend
      dockerfile: Dockerfile
    container_name: erpstock-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
