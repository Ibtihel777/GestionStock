services:
  postgres:
    image: postgres:16
    container_name: erpstock-postgres
    environment:
      POSTGRES_DB: GestionStock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ERPStock.API/Dockerfile
    container_name: erpstock-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=GestionStock;Username=postgres;Password=${DB_PASSWORD}"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "5083:8080"

  frontend:
    build:
      context: ./ERPStock.Frontend
      dockerfile: Dockerfile
    container_name: erpstock-frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data: